<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpaceScape</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #080b12;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #game {
            width: 100vw;
            height: 100vh;
        }

        /* TITLE SCREEN */

        #title-screen {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #080b12;
        }

        #title-screen h1 {
            font-size: 64px;
            margin-bottom: 10px;
        }

        #title-screen p {
            color: #9aa4b2;
            margin-bottom: 35px;
        }

        #play-button {
            padding: 15px 45px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 6px;
        }

        /* GAME SCREEN */

        #game-screen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        /* WORLD */

        #world-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        #world {
            width: 2400px;
            height: 1800px;
            position: absolute;
            background:
                radial-gradient(circle at 20% 30%, #243427 0%, transparent 25%),
                radial-gradient(circle at 70% 60%, #202f25 0%, transparent 30%),
                #18221b;
        }

        /* ROADS */

        .road {
            position: absolute;
            background: #30353a;
        }

        .road.horizontal {
            height: 90px;
            width: 2400px;
        }

        .road.vertical {
            width: 90px;
            height: 1800px;
        }

        .road-line {
            position: absolute;
            background: #b4a76c;
        }

        .road-line.horizontal {
            height: 4px;
            width: 2400px;
        }

        .road-line.vertical {
            width: 4px;
            height: 1800px;
        }

        /* BUILDINGS */

        .building {
            position: absolute;
            background: #505963;
            border: 4px solid #303740;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.25);
        }

        .building::after {
            content: "";
            position: absolute;
            width: 35%;
            height: 18%;
            left: 10%;
            top: 15%;
            background: #8ba8b8;
            box-shadow:
                80px 0 #8ba8b8,
                160px 0 #8ba8b8;
        }

        .building-label {
            position: absolute;
            top: -30px;
            left: 0;
            color: #d8dde3;
            font-size: 14px;
            white-space: nowrap;
        }

        /* COLONY WALL */

        #colony-wall {
            position: absolute;
            left: 250px;
            top: 180px;
            width: 1700px;
            height: 1200px;
            border: 12px solid #68737c;
            pointer-events: none;
        }

        /* TREES */

        .tree {
            position: absolute;
            width: 40px;
            height: 55px;
        }

        .tree::before {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #314d35;
            top: 0;
        }

        .tree::after {
            content: "";
            position: absolute;
            width: 10px;
            height: 25px;
            background: #554333;
            left: 15px;
            top: 30px;
        }

        /* ROCKS */

        .rock {
            position: absolute;
            width: 35px;
            height: 25px;
            background: #555d60;
            border-radius: 40%;
        }

        /* PLAYER */

        #player {
            width: 34px;
            height: 34px;
            background: #e8e8e8;
            border: 3px solid #111;
            border-radius: 4px;
            position: absolute;
            z-index: 20;
            transform: translate(-50%, -50%);
        }

        /* HUD */

        #hud {
            position: fixed;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 20px;
            border-radius: 8px;
            z-index: 100;
            min-width: 180px;
        }

        #hud-title {
            font-weight: bold;
            margin-bottom: 10px;
            color: #d8dde3;
        }

        .hud-row {
            margin: 5px 0;
        }

        /* LOCATION */

        #location {
            position: fixed;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px 18px;
            border-radius: 8px;
            z-index: 100;
            color: #c8d0d8;
        }
    </style>
</head>

<body>

<div id="game">

    <!-- TITLE SCREEN -->

    <div id="title-screen">
        <div>
            <h1>SpaceScape</h1>
            <p>A sci-fi skill-based RPG</p>
            <button id="play-button">PLAY</button>
        </div>
    </div>

    <!-- GAME -->

    <div id="game-screen">

        <div id="world-container">

            <div id="world">

                <!-- COLONY WALL -->

                <div id="colony-wall"></div>

                <!-- ROADS -->

                <div class="road horizontal" style="top: 745px;"></div>
                <div class="road vertical" style="left: 1155px;"></div>

                <div class="road-line horizontal" style="top: 788px;"></div>
                <div class="road-line vertical" style="left: 1198px;"></div>

                <!-- BUILDINGS -->

                <div class="building" style="left: 450px; top: 350px; width: 300px; height: 190px;">
                    <div class="building-label">COLONY COMMAND</div>
                </div>

                <div class="building" style="left: 1350px; top: 350px; width: 300px; height: 190px;">
                    <div class="building-label">MEDICAL CENTER</div>
                </div>

                <div class="building" style="left: 450px; top: 1000px; width: 300px; height: 190px;">
                    <div class="building-label">ENGINEERING BAY</div>
                </div>

                <div class="building" style="left: 1350px; top: 1000px; width: 300px; height: 190px;">
                    <div class="building-label">TRADING POST</div>
                </div>

                <!-- TREES -->

                <div class="tree" style="left: 330px; top: 350px;"></div>
                <div class="tree" style="left: 380px; top: 420px;"></div>
                <div class="tree" style="left: 1740px; top: 350px;"></div>
                <div class="tree" style="left: 1790px; top: 430px;"></div>

                <div class="tree" style="left: 330px; top: 1000px;"></div>
                <div class="tree" style="left: 380px; top: 1080px;"></div>
                <div class="tree" style="left: 1740px; top: 1000px;"></div>
                <div class="tree" style="left: 1790px; top: 1080px;"></div>

                <!-- ROCKS -->

                <div class="rock" style="left: 600px; top: 620px;"></div>
                <div class="rock" style="left: 700px; top: 650px;"></div>
                <div class="rock" style="left: 1450px; top: 620px;"></div>
                <div class="rock" style="left: 1550px; top: 650px;"></div>

                <!-- PLAYER -->

                <div id="player"></div>

            </div>

        </div>

        <!-- HUD -->

        <div id="hud">
            <div id="hud-title">SPACESCAPE</div>

            <div class="hud-row">
                Level: <span id="level">1</span>
            </div>

            <div class="hud-row">
                Health: <span id="health">100</span>/100
            </div>

            <div class="hud-row">
                XP: <span id="xp">0</span>
            </div>
        </div>

        <div id="location">
            Aurelia Colony
        </div>

    </div>

</div>

<script>

    const playButton = document.getElementById("play-button");
    const titleScreen = document.getElementById("title-screen");
    const gameScreen = document.getElementById("game-screen");

    const world = document.getElementById("world");
    const player = document.getElementById("player");

    let playerX = 1200;
    let playerY = 900;

    const speed = 5;

    const keys = {};

    playButton.addEventListener("click", () => {

        titleScreen.style.display = "none";
        gameScreen.style.display = "block";

        updateCamera();

    });

    document.addEventListener("keydown", (event) => {

        keys[event.key.toLowerCase()] = true;

    });

    document.addEventListener("keyup", (event) => {

        keys[event.key.toLowerCase()] = false;

    });

    function updatePlayer() {

        if (keys["w"] || keys["arrowup"]) {
            playerY -= speed;
        }

        if (keys["s"] || keys["arrowdown"]) {
            playerY += speed;
        }

        if (keys["a"] || keys["arrowleft"]) {
            playerX -= speed;
        }

        if (keys["d"] || keys["arrowright"]) {
            playerX += speed;
        }

        /* WORLD BOUNDARIES */

        playerX = Math.max(20, Math.min(2380, playerX));
        playerY = Math.max(20, Math.min(1780, playerY));

        player.style.left = playerX + "px";
        player.style.top = playerY + "px";

        updateCamera();

        requestAnimationFrame(updatePlayer);

    }

    function updateCamera() {

        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        let cameraX = playerX - screenWidth / 2;
        let cameraY = playerY - screenHeight / 2;

        cameraX = Math.max(
            0,
            Math.min(2400 - screenWidth, cameraX)
        );

        cameraY = Math.max(
            0,
            Math.min(1800 - screenHeight, cameraY)
        );

        world.style.left = -cameraX + "px";
        world.style.top = -cameraY + "px";

    }

    updatePlayer();

</script>

</body>
</html>
