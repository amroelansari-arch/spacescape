        }

        /* =========================
           BUILDINGS

        .building {
            position: absolute;
            background: #505963;
            border: 4px solid #303740;
            box-shadow: 0 8px 0 rgba(0, 0, 0, 0.25);
        }

        .building::after {
            content: "";
            position: absolute;
            width: 35%;
            height: 18%;
            left: 10%;
            top: 15%;
            background: #8ba8b8;
            box-shadow:
                80px 0 #8ba8b8,
                160px 0 #8ba8b8;
        }

        .building-label {
            position: absolute;

            left: 0;
            color: #d8dde3;

        }

        /* =========================
           TREES
        ========================= */

        .tree {
            position: absolute;

            height: 55px;
        }

        .tree::before {
            content: "";
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #314d35;

        }

        .tree::after {
            content: "";

        /* =========================

<script>

    /* =========================
       BASIC GAME VARIABLES
    ========================= */

    const playButton =
        document.getElementById("play-button");

    const titleScreen =
        document.getElementById("title-screen");

    const gameScreen =
        document.getElementById("game-screen");

    const world =
        document.getElementById("world");

    const player =
        document.getElementById("player");


    /* =========================
       PLAYER
    ========================= */

    let playerX = 1200;
    let playerY = 900;

    const playerSize = 34;
    const speed = 5;

    const keys = {};


    /* =========================
       COLLISION OBJECTS
    ========================= */

    const obstacles = [

        /* Colony Command */
        {
            x: 450,
            y: 350,
            width: 300,
            height: 190
        },

        /* Medical Center */
        {
            x: 1350,
            y: 350,
            width: 300,
            height: 190
        },

        /* Engineering Bay */
        {
            x: 450,
            y: 1000,
            width: 300,
            height: 190
        },

        /* Trading Post */
        {
            x: 1350,
            y: 1000,
            width: 300,
            height: 190
        },

        /* Rocks */
        {
            x: 600,
            y: 620,
            width: 35,
            height: 25
        },

        {
            x: 700,
            y: 650,
            width: 35,
            height: 25
        },

        {
            x: 1450,
            y: 620,
            width: 35,
            height: 25
        },

        {
            x: 1550,
            y: 650,
            width: 35,
            height: 25
        }
    ];


    /* =========================
       COLLISION DETECTION
    ========================= */

    function isColliding(x, y) {

        const half =
            playerSize / 2;

        const playerLeft =
            x - half;

        const playerRight =
            x + half;

        const playerTop =
            y - half;

        const playerBottom =
            y + half;


        for (const obstacle of obstacles) {

            const obstacleLeft =
                obstacle.x;

            const obstacleRight =
                obstacle.x +
                obstacle.width;

            const obstacleTop =
                obstacle.y;

            const obstacleBottom =
                obstacle.y +
                obstacle.height;


            if (
                playerRight > obstacleLeft &&
                playerLeft < obstacleRight &&
                playerBottom > obstacleTop &&
                playerTop < obstacleBottom
            ) {
                return true;
            }
        }


        return false;
    }


    /* =========================
       PLAY BUTTON
    ========================= */

    playButton.addEventListener(
        "click",
        function () {

            titleScreen.style.display =
                "none";

            gameScreen.style.display =
                "block";

            updateCamera();
        }
    );


    /* =========================
       KEYBOARD
    ========================= */

    document.addEventListener(
        "keydown",
        function (event) {

            keys[event.key.toLowerCase()] =
                true;

        }
    );


    document.addEventListener(
        "keyup",
        function (event) {

            keys[event.key.toLowerCase()] =
                false;

        }
    );


    /* =========================
       PLAYER MOVEMENT
    ========================= */

    function updatePlayer() {

        let newX =
            playerX;

        let newY =
            playerY;


        /* UP */

        if (
            keys["w"] ||
            keys["arrowup"]
        ) {
            newY -= speed;
        }


        /* DOWN */

        if (
            keys["s"] ||
            keys["arrowdown"]
        ) {
            newY += speed;
        }


        /* LEFT */

        if (
            keys["a"] ||
            keys["arrowleft"]
        ) {
            newX -= speed;
        }


        /* RIGHT */

        if (
            keys["d"] ||
            keys["arrowright"]
        ) {
            newX += speed;
        }


        /* =========================
           COLLISION
        ========================= */

        if (
            !isColliding(
                newX,
                playerY
            )
        ) {
            playerX =
                newX;
        }


        if (
            !isColliding(
                playerX,
                newY
            )
        ) {
            playerY =
                newY;
        }


        /* =========================
           WORLD BOUNDARIES
        ========================= */

        playerX =
            Math.max(
                20,
                Math.min(
                    2380,
                    playerX
                )
            );

        playerY =
            Math.max(
                20,
                Math.min(
                    1780,
                    playerY
                )
            );


        /* =========================
           DRAW PLAYER
        ========================= */

        player.style.left =
            playerX + "px";

        player.style.top =
            playerY + "px";


        /* CAMERA */

        updateCamera();


        requestAnimationFrame(
            updatePlayer
        );
    }


    /* =========================
       CAMERA
    ========================= */

    function updateCamera() {

        const screenWidth =
            window.innerWidth;

        const screenHeight =
            window.innerHeight;


        let cameraX =
            playerX -
            screenWidth / 2;

        let cameraY =
            playerY -
            screenHeight / 2;


        cameraX =
            Math.max(
                0,
                Math.min(
                    2400 -
                    screenWidth,
                    cameraX
                )
            );


        cameraY =
            Math.max(
                0,
                Math.min(
                    1800 -
                    screenHeight,
                    cameraY
                )
            );


        world.style.left =
            -cameraX + "px";

        world.style.top =
            -cameraY + "px";
    }


    /* =========================
       START GAME LOOP
    ========================= */

    updatePlayer();

</script>
